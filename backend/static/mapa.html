<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dados Horário Brasil</title>

<!-- 📱 MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Geocoder -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

#map {
  width: 100vw;
  height: 100vh;
}

/* 📌 LEGENDA */
#legenda {
  position: fixed;
  bottom: 12px;
  left: 12px;
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  border-radius: 10px;
  font-size: 13px;
  max-width: 300px;
  z-index: 9999;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  overflow: hidden;
}

/* Cabeçalho clicável (mobile) */
#legenda-header {
  padding: 10px 12px;
  font-weight: bold;
  cursor: pointer;
  background: rgba(255,255,255,0.08);
}

/* Conteúdo da legenda */
#legenda-conteudo {
  padding: 10px 12px;
}

#legenda hr {
  border: 0;
  border-top: 1px solid rgba(255,255,255,0.25);
  margin: 8px 0;
}

/* 📱 Mobile */
@media (max-width: 768px) {
  #legenda {
    left: 50%;
    transform: translateX(-50%);
    max-width: 92vw;
  }

  #legenda.fechada #legenda-conteudo {
    display: none;
  }

  .link-relatorio {
    width: 100%;
    text-align: center;
    font-size: 14px;
  }
}

/* 🖥️ Desktop */
@media (min-width: 769px) {
  #legenda-header {
    display: none;
  }
}

/* 🗨️ POPUPS */
.leaflet-popup-content {
  font-size: 14px;
  line-height: 1.4;
}

.leaflet-popup-content small {
  color: #666;
}

/* 🔗 LINKS */
.link-extremos {
  display: inline-block;
  margin-top: 6px;
  color: #ffffff;   
  font-weight: bold;
  text-decoration: underline;
  cursor: pointer;
}

.link-extremos:hover {
  opacity: 0.8;
}
.link-quente {
  color: #ff9800;
  font-weight: bold;
  text-decoration: none;
}

.link-frio {
  color: #4fc3f7;
  font-weight: bold;
  text-decoration: none;
}

.link-chuva {
  color: #81c784;
  font-weight: bold;
  text-decoration: none;
}

.link-quente:hover,
.link-frio:hover,
.link-chuva:hover {
  text-decoration: underline;
}

.botao-extremos{
  display:inline-block;
  background:#1f4ed8;
  color:#fff;
  padding:8px 14px;
  border-radius:6px;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
  transition:0.2s;
}

.botao-extremos:hover{
  background:#1f4ed8;
  transform:scale(1.05);
}

/* 📊 LINK RELATÓRIO ESTAÇÃO */
.btn-relatorio {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 14px;
  background: linear-gradient(135deg, #1f4ed8, #1f4ed8);
  color: white !important;   /* 👈 força texto branco */
  text-decoration: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.25s ease;
}

.btn-relatorio:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.25);
  background: linear-gradient(135deg, #1f4ed8, #1f4ed8);
}

.btn-relatorio .icon {
  font-size: 16px;
}

.btn-relatorio:hover {
  color: white !important;   /* 👈 mantém branco no hover */
}
</style>
</head>

<body>

<div id="map"></div>

<div id="legenda" class="fechada">
  <div id="legenda-header">📊 Top 05 Horario</div>
  <div id="legenda-conteudo">⏳ Carregando informações...</div>
</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Geocoder -->
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
/* 🌍 MAPA */
const map = L.map("map", { zoomControl: false }).setView([-15.78, -47.93], 5);

/* 📱 Zoom confortável */
L.control.zoom({ position: "bottomright" }).addTo(map);

/* 🔍 Busca por cidade */
L.Control.geocoder({
 position: "topright",
 placeholder: "Buscar cidade...",
 errorMessage: "Cidade não encontrada",
 defaultMarkGeocode: true,
 expand: "click"
}).addTo(map);

/* 🗺️ CAMADAS */
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19 }
).addTo(map);

L.tileLayer(
  "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19 }
).addTo(map);

/* 📱 Evita conflito de scroll no celular */
if (window.innerWidth < 768) {
  map.scrollWheelZoom.disable();
}

/* 🔗 API */
const API_URL = "/api/clima";

/* 🧹 CAMADA DE ESTAÇÕES */
const layerEstacoes = L.layerGroup().addTo(map);

/* 🔴 COR POR ATRASO */
function corAtraso(atraso){

  if(atraso == null) return "#9e9e9e";

  if(atraso <= 0) return "#4caf50";   // 🟢 atualizado
  if(atraso <= 1) return "#ffd54f";   // 🟡 até 1h
  if(atraso <= 3) return "#ff9800";   // 🟠 até 3h

  return "#f44336";                   // 🔴 acima de 3h
}

/* 🕒 FORMATA DATA */
function formatarDataBR(dataStr) {
  if (!dataStr) return "—";
  const [data, hora] = dataStr.split(" ");
  const [ano, mes, dia] = data.split("-");
  return `${dia}/${mes}/${ano} ${hora.substring(0,2)}:${hora.substring(2,4)}`;
}

/* 🕒 FORMATA DATA HORA (ESTAÇÕES) */
function formatarDataHoraBR_UTC(data, hora) {
  if (!data) return "—";
  const [ano, mes, dia] = data.split("-");
  if (hora?.length === 4) hora = hora.slice(0,2) + ":" + hora.slice(2);
  return `${dia}/${mes}/${ano} ${hora || ""} UTC`;
}

/* ⏳ CALCULA HORAS DE ATRASO */
function calcularAtrasoHoras(data, hora) {

  if (!data || !hora) return null;

  const ano = parseInt(data.substring(0,4));
  const mes = parseInt(data.substring(5,7)) - 1;
  const dia = parseInt(data.substring(8,10));

  const h = parseInt(hora.substring(0,2));

  const dataEstacao = new Date(Date.UTC(ano, mes, dia, h));

  const agora = new Date();

  const diffMs = agora - dataEstacao;

  const diffHoras = Math.floor(diffMs / (1000 * 60 * 60));

  return diffHoras;
}

/* 📡 CARREGAR DADOS */
function carregarDados() {
  fetch(API_URL)
    .then(r => r.json())
    .then(payload => {

      const legendaConteudo = document.getElementById("legenda-conteudo");
      const bounds = [];
      layerEstacoes.clearLayers();

      const validos = payload.dados.filter(d => typeof d.temperatura === "number");

// Contadores horas de atraso
let atualizadas = 0;
let atraso1h = 0;
let atraso3h = 0;
let atraso6h = 0;

payload.dados.forEach(c => {

  const atraso = calcularAtrasoHoras(c.data, c.hora);

  if (atraso == null) return;

  if (atraso <= 0) {
    atualizadas++;
  }
  else if (atraso <= 1) {
    atraso1h++;
  }
  else if (atraso <= 3) {
    atraso3h++;
  }
  else {
    atraso6h++;
  }

});

      const topQuentes = [...validos].sort((a,b)=>b.temperatura-a.temperatura).slice(0,5);
      const topFrias   = [...validos].sort((a,b)=>a.temperatura-b.temperatura).slice(0,5);
      const topChuva   = payload.dados
        .filter(d => d.precipitacao > 0)
        .sort((a,b)=>b.precipitacao-a.precipitacao)
        .slice(0,5);

      legendaConteudo.innerHTML = `
🕒 <b>Atualização:</b><br>
${formatarDataBR(payload.ultima_atualizacao)} UTC<br><br>

🌡️ <b>Estações válidas:</b> ${payload.total_estacoes}<hr>

🟢 Estações atualizadas: ${atualizadas}<br>
🟡 Atraso até 1h: ${atraso1h}<br>
🟠 Atraso até 3h: ${atraso3h}<br>
🔴 Atraso acima de 3h: ${atraso6h}<hr>

<div style="text-align:center;">
<a href="/relatorio/diario" target="_blank" class="botao-extremos">
📊 DADOS EXTREMOS DIÁRIO
</a>
</div>

<hr>

🔥 <b class="link-quente">Top 5 mais quentes horário</b><br>
${topQuentes.map((c,i)=>`${i+1}. ${c.nome}/${c.uf} — <b>${c.temperatura}°C</b>`).join("<br>")}
<br><br>

❄️ <b class="link-frio">Top 5 mais frias horário</b><br>
${topFrias.map((c,i)=>`${i+1}. ${c.nome}/${c.uf} — <b>${c.temperatura}°C</b>`).join("<br>")}
<br><br>

🌧️ <b class="link-chuva">Top 5 precipitação horário</b><br>
${topChuva.length
  ? topChuva.map((c,i)=>`${i+1}. ${c.nome}/${c.uf} — <b>${c.precipitacao} mm</b>`).join("<br>")
  : "Sem registros"}
`;

      payload.dados.forEach(c => {
        if (!c.lat || !c.lon) return;
        bounds.push([c.lat, c.lon]);

        const atraso = calcularAtrasoHoras(c.data, c.hora);

        L.circleMarker([c.lat, c.lon], {
          radius: window.innerWidth < 768 ? 8 : 6,
          fillColor: corAtraso(atraso),
          color: "#fff",
          weight: 1,
          fillOpacity: 0.9
        })
        .bindPopup(`

<b>${c.nome}/${c.uf} - ${c.codigo}</b><br>

<small>
🕒 Última atualização: ${formatarDataHoraBR_UTC(c.data, c.hora)}<br>
⚠️ Atraso: ${atraso ?? "—"}h
</small>

<br><br>

🌡️ Temperatura: ${c.temperatura ?? "—"} °C<br>
🌡️ Máxima: ${c.temperatura_maxima ?? "—"} °C<br>
🌡️ Mínima: ${c.temperatura_minima ?? "—"} °C<br>

💧 Umidade: ${c.umidade ?? "—"} %<br>

💨 Vento: ${c.vento ?? "—"} m/s<br>
💨 Rajada: ${c.vento_rajada ?? "—"} m/s<br>

🌧️ Chuva: ${c.precipitacao ?? 0} mm<br><br>

<a href="/diario/${c.codigo}"
   target="_blank"
   rel="noopener noreferrer" 
   class="btn-relatorio">
   <span class="icon">📊</span>
   Dados Diários
</a>
`)

        .bindTooltip(`<b>${c.nome}/${c.uf} - ${c.codigo}</b>`, { sticky: true })
        .addTo(layerEstacoes);
      });

      if (bounds.length) map.fitBounds(bounds);
    })
    .catch(() => {
      document.getElementById("legenda-conteudo").innerHTML = "❌ Erro ao conectar à API";
    });
}

carregarDados();
setInterval(carregarDados, 600000);

/* 🖐️ Toggle legenda no mobile */
const legenda = document.getElementById("legenda");
const headerLegenda = document.getElementById("legenda-header");

if (headerLegenda) {
  headerLegenda.addEventListener("click", () => {
    legenda.classList.toggle("fechada");
  });
}

/* 🤏 Recolher legenda automaticamente ao mover o mapa (MOBILE ONLY) */
function recolherLegendaMobile() {
  if (window.innerWidth <= 768 && !legenda.classList.contains("fechada")) {
    legenda.classList.add("fechada");
  }
}

// Arrastar mapa
map.on("movestart", recolherLegendaMobile);

// Zoom (botão ou gesto)
map.on("zoomstart", recolherLegendaMobile);
</script>

</body>
</html>
